<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="540" height="190" role="img" aria-label="Otto">
  <title>Otto</title>

  <!-- The lightbulb is the TUI's own motif; its filament is drawn as a
       waveform because the thing Otto mostly does now is listen and talk. -->
  <g fill="none" stroke="#F5A623" stroke-width="11" stroke-linecap="round">
    <circle cx="104" cy="78" r="46"/>
  </g>

  <!-- Filament as an audio level meter. -->
  <g stroke="#F5A623" stroke-width="9" stroke-linecap="round">
    <line x1="72"  y1="67" x2="72"  y2="89"/>
    <line x1="88"  y1="57" x2="88"  y2="99"/>
    <line x1="104" y1="49" x2="104" y2="107"/>
    <line x1="120" y1="60" x2="120" y2="96"/>
    <line x1="136" y1="70" x2="136" y2="86"/>
  </g>

  <!-- Screw base. -->
  <g fill="#8B949E">
    <rect x="86" y="126" width="36" height="9" rx="4.5"/>
    <rect x="90" y="139" width="28" height="9" rx="4.5"/>
    <rect x="95" y="152" width="18" height="8" rx="4"/>
  </g>

  <!-- Wordmark, drawn as geometry rather than text so it renders identically
       everywhere regardless of installed fonts. -->
  <g fill="none" stroke="#8B949E" stroke-width="11" stroke-linecap="round">
    <rect x="224" y="63" width="52" height="64" rx="26"/>

    <line x1="294" y1="68.5" x2="346" y2="68.5"/>
    <line x1="320" y1="68.5" x2="320" y2="127"/>

    <line x1="362" y1="68.5" x2="414" y2="68.5"/>
    <line x1="388" y1="68.5" x2="388" y2="127"/>

    <rect x="430" y="63" width="52" height="64" rx="26"/>
  </g>
</svg>
